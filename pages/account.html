<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>حسابي — Nishdan Integrative Health</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Same vivid palette as the homepage */
        --cream: #fffaf2;
        --cream-2: #fff3e3;
        --mint: #eaf7e4;
        --ink: #1f2a1c;
        --ink-soft: #55604f;
        --green-deep: #1f5a32;
        --green: #2f8a45;
        --green-bright: #5cb85c;
        --gold: #f0a91c;
        --gold-deep: #d98e00;
        --coral: #f2734f;
        --coral-tint: #ffe9e0;
        --berry: #e04f7a;
        --line: #efe4d2;
        --white: #ffffff;
        --shadow: 0 24px 48px -24px rgba(31, 90, 50, 0.35);
        --font-display: "Playfair Display", Georgia, serif;
        --font-body: "Jost", "Segoe UI", sans-serif;
        --font-arabic: "IBM Plex Sans Arabic", "Plus Jakarta Sans", Tahoma, Arial, sans-serif;
        --ease: cubic-bezier(.22, .61, .36, 1);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        font-family: var(--font-body);
        color: var(--ink);
        background: var(--cream);
        line-height: 1.6;
        direction: ltr;
        font-size: 0.96rem;
        overflow-x: hidden;
      }
      .ar { direction: rtl; font-family: var(--font-arabic); text-align: right; }
      h1, h2, h3 { font-family: var(--font-display); color: var(--ink); }
      .ar h1, .ar h3 { font-family: var(--font-arabic); font-weight: 700; }
      a { text-decoration: none; color: inherit; }
      img { display: block; width: 100%; object-fit: cover; }

      .container { max-width: 1000px; margin: 0 auto; padding: 0 24px; }

      /* ---------- HEADER (same as homepage) ---------- */
      .site-header {
        background: rgba(255, 250, 242, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        position: sticky; top: 0; z-index: 100;
        border-bottom: 1px solid rgba(31, 90, 50, 0.08);
      }
      .header-wrap {
        max-width: 1180px; margin: 0 auto;
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 32px; min-height: 104px; position: relative;
      }
      .logo { display: flex; align-items: center; gap: 14px; color: var(--green-deep); }
            .logo-mark { height: 72px; width: auto; flex-shrink: 0; filter: drop-shadow(0 6px 10px rgba(31, 90, 50, 0.18)); transition: transform .5s var(--ease); }
      .logo:hover .logo-mark { transform: rotate(-6deg) scale(1.06); }
      .logo-text { padding-left: 14px; border-left: 2px solid var(--gold); }
      .logo-text { display: flex; flex-direction: column; line-height: 1; }
      .logo-name { font-family: var(--font-display); font-size: 1.85rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--green-deep); }
      .logo-tag { font-size: 0.72rem; letter-spacing: 2.4px; text-transform: uppercase; color: var(--gold-deep); font-weight: 600; margin-top: 7px; }

      .nav-links { display: flex; gap: 6px; }
      .nav-links a {
        font-size: 0.85rem; letter-spacing: 0.6px; text-transform: uppercase; font-weight: 600;
        color: var(--ink); padding: 9px 16px; border-radius: 999px; transition: background .25s, color .25s;
      }
      .nav-links a:hover { background: var(--mint); color: var(--green); }
      .nav-links a.active { background: var(--green); color: var(--white); }

      .menu-toggle { display: none; background: none; border: none; cursor: pointer; color: var(--ink); padding: 4px; }
      .menu-toggle svg { width: 26px; height: 26px; }

      
      /* ---------- TOP BAND (decorative) ---------- */
      .top-band { position: relative; height: 260px; overflow: hidden; background: var(--green-deep); }
      .top-band img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: heroZoom 18s ease-in-out infinite alternate; }
      .top-band::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, rgba(20, 60, 33, 0.9), rgba(47, 138, 69, 0.7) 55%, rgba(240, 169, 28, 0.45)); }
      @keyframes heroZoom { from { transform: scale(1); } to { transform: scale(1.08); } }
      @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

      /* ---------- AUTH SECTION ---------- */
      .auth-section { position: relative; z-index: 2; margin-top: -180px; padding-bottom: 90px; }

      .auth-container {
        position: relative; overflow: hidden;
        max-width: 500px;
        margin: 0 auto;
        background: var(--white);
        border-radius: 28px;
        padding: 40px 36px 34px;
        box-shadow: 0 30px 60px -34px rgba(31, 42, 28, 0.55);
        border: 1px solid rgba(31, 42, 28, 0.06);
        animation: rise .8s var(--ease) both;
      }
      .auth-container::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
        background: linear-gradient(90deg, var(--green-bright), var(--gold), var(--coral), var(--berry));
      }

      /* التبويبات (تسجيل الدخول / إنشاء حساب) */
      .auth-tabs {
        display: flex; gap: 6px;
        background: var(--mint);
        padding: 6px;
        border-radius: 999px;
        margin-bottom: 28px;
      }
      .tab-btn {
        flex: 1;
        background: none;
        border: none;
        padding: 12px 10px;
        border-radius: 999px;
        font-family: var(--font-arabic);
        font-size: 1rem;
        font-weight: 600;
        color: var(--ink-soft);
        cursor: pointer;
        transition: background .3s, color .3s, box-shadow .3s;
      }
      .tab-btn:hover { color: var(--green); }
      .tab-btn.active {
        background: linear-gradient(135deg, var(--green-bright), var(--green));
        color: var(--white);
        box-shadow: 0 10px 20px -10px rgba(47, 138, 69, 0.8);
      }

      /* النماذج (Forms) */
      .auth-form { display: none; flex-direction: column; gap: 18px; }
      .auth-form.active { display: flex; animation: rise .45s var(--ease) both; }

      .form-group { display: flex; flex-direction: column; gap: 8px; }
      .form-group label { font-size: 0.92rem; font-weight: 600; color: var(--green-deep); }
      .form-group input {
        width: 100%;
        padding: 14px 16px;
        border: 1.5px solid var(--line);
        border-radius: 14px;
        font-family: var(--font-body);
        font-size: 0.95rem;
        background: var(--cream);
        color: var(--ink);
        outline: none;
        transition: border-color .25s, background .25s, box-shadow .25s;
      }
      .form-group input:hover { border-color: rgba(31, 90, 50, 0.25); }
      .form-group input:focus {
        border-color: var(--green);
        background: var(--white);
        box-shadow: 0 0 0 4px rgba(92, 184, 92, 0.18);
      }

      .btn-submit {
        display: block; width: 100%;
        background: linear-gradient(135deg, #ffc23d, var(--gold) 45%, var(--coral));
        color: var(--white);
        text-align: center;
        padding: 15px;
        border-radius: 999px;
        font-family: var(--font-arabic);
        font-weight: 700;
        font-size: 1.05rem;
        border: none;
        cursor: pointer;
        margin-top: 6px;
        box-shadow: 0 16px 32px -12px rgba(242, 115, 79, 0.7);
        transition: transform .25s var(--ease), box-shadow .25s, filter .25s;
      }
      .btn-submit:hover { transform: translateY(-3px); filter: brightness(1.06); box-shadow: 0 20px 38px -12px rgba(242, 115, 79, 0.85); }

      .auth-note { text-align: center; font-size: 0.88rem; line-height: 1.8; color: var(--ink-soft); margin-top: 6px; }

      /* ---------- FOOTER (homepage style) ---------- */
      .site-footer {
        position: relative;
        background: linear-gradient(160deg, #164a29 0%, var(--green-deep) 60%, #2a6b3f 100%);
        color: #c7d4c0; padding: 34px 0; text-align: center; font-size: 0.85rem;
      }
      .site-footer::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, var(--green-bright), var(--gold), var(--coral), var(--berry)); }

      /* ---------- RESPONSIVE MOBILE ---------- */
      @media (max-width: 850px) {
        .nav-links {
          display: none; position: absolute; top: 100%; left: 0; width: 100%; background: var(--white);
          flex-direction: column; align-items: center; padding: 18px 0; gap: 6px; z-index: 200;
          border-bottom: 1px solid var(--line); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.06);
        }
        .nav-links.active { display: flex; }
        .menu-toggle { display: inline-flex; align-items: center; }
        .auth-container { padding: 34px 20px 28px; }
      }
      @media (max-width: 560px) {
        .header-wrap { min-height: 84px; padding: 12px 18px; }
        .logo { gap: 10px; }
        .logo-mark { height: 56px; }
        .logo-text { padding-left: 10px; }
        .logo-name { font-size: 1.35rem; letter-spacing: 2px; }
        .logo-tag { font-size: 0.6rem; letter-spacing: 1.6px; }
        .container { padding: 0 14px; }
        .top-band { height: 220px; }
        .auth-section { margin-top: -160px; padding-bottom: 60px; }
        .tab-btn { font-size: 0.92rem; padding: 11px 6px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>

    <!-- AUTH SECTION -->
    <main class="container auth-section">
      <div class="auth-container ar">
        
        <!-- التبويبات -->
        <div class="auth-tabs">
          <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
          <button class="tab-btn" onclick="switchTab('register')">إنشاء حساب جديد</button>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form class="auth-form active" id="loginForm" onsubmit="event.preventDefault(); alert('تم تسجيل الدخول بنجاح!');">
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" placeholder="name@example.com" required />
          </div>
          <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn-submit">دخول إلى حسابي</button>
          <p class="auth-note">سجل دخولك لتتمكن من الوصول لجميع دوراتك المدفوعة بكل سهولة.</p>
        </form>

        <!-- نموذج إنشاء حساب -->
        <form class="auth-form" id="registerForm" onsubmit="event.preventDefault(); alert('تم إنشاء الحساب بنجاح!');">
          <div class="form-group">
            <label>الاسم الكامل</label>
            <input type="text" placeholder="اسمك الكريم" required />
          </div>
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" placeholder="name@example.com" required />
          </div>
          <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn-submit">إنشاء الحساب والشراء</button>
          <p class="auth-note">بإنشاء حسابك، ستتمكن من حفظ دوراتك وإتمام عمليات الشراء بأمان.</p>
        </form>

    <!-- سكريبت تبديل التبويبات وقائمة الموبايل -->
    <script>
      // قائمة الموبايل
      const menuToggle = document.getElementById('menuToggle');
      const mainNav = document.getElementById('mainNav');

      menuToggle.addEventListener('click', () => {
        mainNav.classList.toggle('active');
      });

      // تبديل بين نموذج تسجيل الدخول وإنشاء الحساب
      function switchTab(tab) {
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const tabBtns = document.querySelectorAll('.tab-btn');

        tabBtns.forEach(btn => btn.classList.remove('active'));

        if (tab === 'login') {
          loginForm.classList.add('active');
          registerForm.classList.remove('active');
          tabBtns[0].classList.add('active');
        } else {
          registerForm.classList.add('active');
          loginForm.classList.remove('active');
          tabBtns[1].classList.add('active');
        }
      }
    </script>
